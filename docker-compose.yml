# openclaw-unraid via the derived image (non-Unraid / generic Docker hosts).
# Mirrors the Unraid template: PUID/PGID ownership + first-boot config seeding
# are handled by the image's entrypoint (docker/unraid-entrypoint.sh).
# No user/entrypoint overrides needed — the image owns them.

services:
  openclaw:
    image: ghcr.io/thebtf/openclaw-unraid:latest
    container_name: openclaw
    hostname: OpenClaw
    restart: unless-stopped

    ports:
      - "18789:18789"

    volumes:
      # OpenClaw home -- config, sessions, plugins, media, credentials
      - ./data:/home/node/.openclaw:rw
      # Agent workspace (AGENTS.md, SOUL.md, memory, skills) -- sub-mount
      - ./workspace:/home/node/.openclaw/workspace:rw
      # Homebrew packages (persists brew installs; optional)
      - ./homebrew:/home/linuxbrew/.linuxbrew:rw
      # ~/.local persistence: pip --user installs, manually-built CLIs
      - ./local:/home/node/.local:rw
      # Gateway logs (logging.file pinned to /tmp/openclaw/openclaw.log)
      - ./logs:/tmp/openclaw:rw

    environment:
      # Canonical image runtime paths; fixed values, not host-tunable inputs.
      - HOME=/home/node
      - OPENCLAW_HOME=/home/node
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
      - OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - OPENCLAW_WORKSPACE_DIR=/home/node/.openclaw/workspace
      - TZ=${TZ:-UTC}
      # Host uid/gid that should own files in the mounts above
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # REQUIRED
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:?Gateway token required}
      # REQUIRED since OpenClaw 2026.2: comma-separated browser origins for the Control UI.
      # Example: http://192.168.1.41:18789  or  http://192.168.1.41:18789,http://openclaw.local:18789
      - OPENCLAW_ALLOWED_ORIGINS=${OPENCLAW_ALLOWED_ORIGINS:?Allowed origins required (e.g. http://YOUR-IP:18789)}
      # Invalid persisted configs are detected without writes by default. Set
      # apply-v2026.8.1 for one reviewed migration start, then return to check.
      - OPENCLAW_CONFIG_MIGRATION=${OPENCLAW_CONFIG_MIGRATION:-check}
      # Custom LLM endpoint (optional; FIRST-BOOT seed only — after that
      # openclaw.json owns the config, see CHANGELOG v2.0.0)
      - CUSTOM_LLM_BASE_URL=${CUSTOM_LLM_BASE_URL:-}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY:-}
      - CUSTOM_LLM_API_TYPE=${CUSTOM_LLM_API_TYPE:-openai-completions}
      - CUSTOM_LLM_MODEL_ID=${CUSTOM_LLM_MODEL_ID:-}
      - CUSTOM_LLM_CONTEXT_WINDOW=${CUSTOM_LLM_CONTEXT_WINDOW:-128000}
      - CUSTOM_LLM_MAX_TOKENS=${CUSTOM_LLM_MAX_TOKENS:-32000}
      - CUSTOM_LLM_REASONING=${CUSTOM_LLM_REASONING:-1}
      # Log rotation tuning (archive count is hardcoded to 5 in openclaw)
      - OPENCLAW_LOG_MAX_FILE_BYTES=${OPENCLAW_LOG_MAX_FILE_BYTES:-104857600}
      # Built-in LLM providers (use one of these OR Custom LLM Base URL)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      # Optional channels
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # System PATH including ~/.local/bin, Homebrew, Bun, Cargo
      - PATH=/home/node/.local/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/home/node/.bun/bin:/home/node/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

# ==============================================================================
# QUICK START
# ==============================================================================
#
# 1. Create .env file:
#    PUID=1000
#    PGID=1000
#    OPENCLAW_GATEWAY_TOKEN=your-secret-token
#    OPENCLAW_ALLOWED_ORIGINS=http://localhost:18789
#    ANTHROPIC_API_KEY=sk-ant-...        # OR use a custom router:
#    # CUSTOM_LLM_BASE_URL=http://litellm:4000/v1
#    # CUSTOM_LLM_API_KEY=sk-...
#    # CUSTOM_LLM_API_TYPE=openai-completions
#    # CUSTOM_LLM_MODEL_ID=gpt-5.5
#
# 2. Start:
#    docker compose up -d
#
# 3. Access Control UI:
#    http://localhost:18789/?token=YOUR_TOKEN
#
# CONFIG OWNERSHIP: CUSTOM_LLM_* env seeds openclaw.json on FIRST boot only
# (marker: data/.unraid-template-seeded). After that, edit config via the
# Control UI or `openclaw config set` -- env changes no longer overwrite it.
# To re-seed: delete the marker file and restart.
#
# ==============================================================================
