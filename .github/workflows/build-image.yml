            const fs = require("node:fs");
            const path = require("node:path");
            const fail = (message) => { console.error(`WORKSPACE UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const source = path.join(configDir, "workspace-borges", "openclaw-workspace-state.json");
            const backup = `${source}.openclaw-2026.8.1-pre-migration.bak`;
            if (fs.readdirSync(configDir).includes("openclaw.json")) fail("absent-config dry-run created openclaw.json");
            const expected = JSON.parse(fs.readFileSync("/fixtures/absent-config-dry-run-source-identity.json", "utf8"));
            const actual = fs.lstatSync(source);
            if (!actual.isFile()) fail("absent-config dry-run changed the legacy source type");
            for (const key of ["dev", "ino", "mode", "nlink", "size"]) {
              const value = key === "dev" || key === "ino" ? String(actual[key]) : actual[key];
              if (value !== expected[key]) fail(`absent-config dry-run changed source identity field ${key}`);
