          echo "PERSISTED SESSION-STORE UPGRADE SMOKE OK"

      # PERSISTED EXEC-APPROVALS + DEFAULT-ROLE GATE: seed the retired JSON
      # beside a field-shaped multi-agent config, then prove the exact
      # image-pinned migrations converge without exposing persisted values.
      - name: Persisted exec approvals and default-role smoke
