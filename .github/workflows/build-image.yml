          fi
          if printf '%s\n' "$session_log" | grep -Fq "$session_config_secret" || printf '%s\n' "$session_log" | grep -Fq '"targets"'; then
            echo "SESSION STORE UPGRADE SMOKE FAIL: session migration log disclosed a fixture value or raw Doctor report" 1>&2
            exit 1
          fi
          if ! docker run --rm --user 1000:1000 --entrypoint node \
            -v "$session_volume:/home/node/.openclaw" \
            "$DERIVED_IMAGE:smoke" /app/dist/index.js doctor --session-sqlite dry-run --session-sqlite-all-agents --json \
            > "$session_fixture_dir/postflight.json" 2> "$session_fixture_dir/postflight-error.log"; then
            echo "SESSION STORE UPGRADE SMOKE FAIL: focused postflight did not complete" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$session_volume:/home/node/.openclaw:ro" \
