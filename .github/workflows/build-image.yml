name: build-image

# Rebuild the derived image whenever upstream ghcr.io/openclaw/openclaw
# publishes a new digest, on template pushes, or manually.
#
# Tags published to ghcr.io/thebtf/openclaw-unraid:
#   latest            - tracks upstream :latest
#   <upstream-tag>    - when built from a pinned upstream tag (workflow input)
#
# Pipeline: drift check (cron) -> build local -> SMOKE -> push.
# The smoke gate boots the freshly built image with a throwaway config and
# requires the bootstrap to reach the gateway phase; a broken upstream
# change therefore never reaches :latest (deployments keep running the
# previous image). When repository Issues are enabled, a failure also files or
# updates a deduplicated "rebuild failed" issue; otherwise standard Actions
# failure notification email remains available.

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - docker/**
      - scripts/migrate-openclaw-2-config.py
      - .github/workflows/build-image.yml
  schedule:
    - cron: "23 5 * * *" # daily, off the :00 herd
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream openclaw tag to derive from"
        default: "latest"
        required: false

permissions:
  contents: read
  packages: write
  issues: write

env:
  UPSTREAM_IMAGE: ghcr.io/openclaw/openclaw
  DERIVED_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-unraid

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.gate.outputs.build }}
      upstream_digest: ${{ steps.base.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.upstream_tag || 'latest' }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether upstream digest changed (cron only)
        id: drift
        if: github.event_name == 'schedule'
        run: |
          UPSTREAM_DIGEST=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          OURS_BASE_DIGEST=$(docker buildx imagetools inspect "$DERIVED_IMAGE:latest" --format '{{json .}}' 2>/dev/null \
            | jq -r '..|.["org.opencontainers.image.base.digest"]? // empty' | head -1 || true)
          echo "upstream=$UPSTREAM_DIGEST ours_base=$OURS_BASE_DIGEST"
          if [ -n "$OURS_BASE_DIGEST" ] && [ "$UPSTREAM_DIGEST" = "$OURS_BASE_DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Single gate for every later step: push/dispatch always build;
      # cron builds only on digest drift.
      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.drift.outputs.changed }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Capture upstream digest for provenance label
        if: steps.gate.outputs.build == 'true'
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE:${{ steps.tag.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Build WITHOUT pushing: load into the runner's docker for the smoke gate.
      - name: Build (local, for smoke)
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            OPENCLAW_TAG=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          tags: ${{ env.DERIVED_IMAGE }}:smoke

      # SMOKE GATE: boot the image with throwaway config and require the
      # bootstrap to get through PUID remap + managed config keys and reach
      # the gateway phase. Catches every "loud" break class: entrypoint file
      # paths gone, config set CLI changed, node user renamed, setpriv missing.
      - name: Smoke test
        if: steps.gate.outputs.build == 'true'
        run: |
          set -eu
          docker run -d --name smoke \
            -e PUID=1234 -e PGID=1000 \
            -e OPENCLAW_GATEWAY_TOKEN=smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=smoke-model \
            "$DERIVED_IMAGE:smoke"

          # Bootstrap must reach the gateway exec line, and the container
          # must still be alive (not crash-looped) shortly after.
          # A cold runner may spend 2-3 minutes remapping /app to the non-default
          # PUID before the CLI seed starts; keep this dedicated remap gate bounded at 5 minutes.
          ok=""
          for _ in $(seq 1 60); do
            if docker logs smoke 2>&1 | grep -q "dropping privileges to 1234:1000 and starting gateway"; then
              ok=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              break
            fi
            sleep 5
          done
          echo "--- bootstrap log ---"
          docker logs smoke 2>&1 | tail -60
          if [ -z "$ok" ]; then
            echo "SMOKE FAIL: bootstrap never reached the gateway phase" 1>&2
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
            echo "SMOKE FAIL: container died right after reaching gateway phase" 1>&2
            docker logs smoke 2>&1 | tail -40
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi
          # First-boot seed marker must exist (CUSTOM_LLM_* was set).
          docker exec smoke sh -c 'test -f /home/node/.openclaw/.unraid-template-seeded' \
            || { echo "SMOKE FAIL: seed marker missing" 1>&2; docker rm -f smoke >/dev/null 2>&1; exit 1; }
          echo "SMOKE OK"
          docker rm -f smoke >/dev/null

      # PERSISTED-CONFIG UPGRADE GATE: a persisted legacy `check` setting must
      # promote to auto and reach readiness; explicit `dry-run` must leave the
      # legacy fixture untouched; default auto must migrate legacy and partial
      # shapes backup-first only after candidate validation; a mixed config
      # that migrates narrowly but fails native validation must refuse safely.
      # This gate uses the image-native UID so migration behavior is isolated;
      # the dedicated smoke above retains the PUID remap budget.
      - name: Persisted-config upgrade smoke
        if: steps.gate.outputs.build == 'true'
        run: |
          set -eu
          legacy_check_container=smoke-upgrade-legacy-check
          dry_run_container=smoke-upgrade-dry-run
          auto_container=smoke-upgrade-auto
          restart_container=smoke-upgrade-restart
          partial_container=smoke-upgrade-partial
          mixed_invalid_container=smoke-upgrade-mixed-invalid
          legacy_check_volume=smoke-upgrade-legacy-check-config
          dry_run_volume=smoke-upgrade-dry-run-config
          auto_volume=smoke-upgrade-auto-config
          partial_volume=smoke-upgrade-partial-config
          mixed_invalid_volume=smoke-upgrade-mixed-invalid-config
          fixture_file=""
          partial_fixture_file=""
          mixed_invalid_fixture_file=""
          privacy_fixture_dir=""
          migration_required_marker='[bootstrap] existing config needs OpenClaw v2026.8.1 migration'
          migration_auto_marker='[bootstrap] auto-applying supported backup-first OpenClaw v2026.8.1 migration'
          legacy_check_compatibility_marker='OPENCLAW_CONFIG_MIGRATION=check is deprecated and now behaves as auto'
          candidate_validated_marker='[bootstrap] candidate migration passed native OpenClaw validation'
          dry_run_plan_marker='dry run: planned changed paths'
          dry_run_refusal_marker='OPENCLAW_CONFIG_MIGRATION=dry-run is inspection-only'
          candidate_validation_marker='candidate migration failed native OpenClaw validation'

          cleanup() {
            docker rm -f "$legacy_check_container" >/dev/null 2>&1 || true
            docker rm -f "$dry_run_container" >/dev/null 2>&1 || true
            docker rm -f "$auto_container" >/dev/null 2>&1 || true
            docker rm -f "$restart_container" >/dev/null 2>&1 || true
            docker rm -f "$partial_container" >/dev/null 2>&1 || true
            docker rm -f "$mixed_invalid_container" >/dev/null 2>&1 || true
            if [ -n "$fixture_file" ]; then
              rm -f "$fixture_file"
            fi
            if [ -n "$partial_fixture_file" ]; then
              rm -f "$partial_fixture_file"
            fi
            if [ -n "$mixed_invalid_fixture_file" ]; then
              rm -f "$mixed_invalid_fixture_file"
            fi
            if [ -n "$privacy_fixture_dir" ]; then
              rm -rf "$privacy_fixture_dir"
            fi
            docker volume rm -f "$legacy_check_volume" "$dry_run_volume" "$auto_volume" "$partial_volume" "$mixed_invalid_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gateway_ready() {
            docker exec "$1" node -e 'fetch("http://127.0.0.1:18789/readyz", { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
          }

          wait_for_exit() {
            for _ in $(seq 1 24); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$1")" != "true" ]; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          wait_for_ready() {
            for _ in $(seq 1 24); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$1")" != "true" ]; then
                return 1
              fi
              if gateway_ready "$1"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          assert_agent_id_redacted() {
            fixture=$1
            private_id=$2
            expected_status=$3
            if migration_output=$(docker run --rm \
              --entrypoint /usr/local/bin/migrate-openclaw-2-config.py \
              -v "$privacy_fixture_dir:/fixtures:ro" \
              "$DERIVED_IMAGE:smoke" --config "/fixtures/$fixture" 2>&1); then
              migration_status=0
            else
              migration_status=$?
            fi
            if [ "$migration_status" -ne "$expected_status" ]; then
              echo "UPGRADE SMOKE FAIL: privacy migration probe returned an unexpected status" 1>&2
              exit 1
            fi
            if printf '%s\n' "$migration_output" | grep -Fq "$private_id"; then
              echo "UPGRADE SMOKE FAIL: path-only migration output disclosed a private agent ID" 1>&2
              exit 1
            fi
          }

          docker volume create "$legacy_check_volume" >/dev/null
          docker volume create "$dry_run_volume" >/dev/null
          docker volume create "$auto_volume" >/dev/null
          docker volume create "$partial_volume" >/dev/null
          docker volume create "$mixed_invalid_volume" >/dev/null
          privacy_fixture_dir=$(mktemp -d)
          cat > "$privacy_fixture_dir/legacy.json" <<'JSON'
          {
            "agents": {
              "list": [
                {
                  "id": "private_legacy_agent",
                  "memorySearch": { "provider": "auto" }
                }
              ]
            }
          }
          JSON
          cat > "$privacy_fixture_dir/keyed.json" <<'JSON'
          {
            "agents": {
              "entries": {
                "private_keyed_agent": {
                  "memorySearch": { "provider": "auto" }
                }
              }
            }
          }
          JSON
          cat > "$privacy_fixture_dir/keyed-invalid.json" <<'JSON'
          {
            "agents": {
              "entries": {
                "private_keyed_agent": {
                  "memorySearch": "invalid"
                }
              }
            }
          }
          JSON
          assert_agent_id_redacted legacy.json private_legacy_agent 0
          assert_agent_id_redacted keyed.json private_keyed_agent 0
          assert_agent_id_redacted keyed-invalid.json private_keyed_agent 1
          fixture_file=$(mktemp)
          cat > "$fixture_file" <<'JSON'
          {
            "meta": {
              "lastTouchedAt": "2026-08-01T00:00:00.000Z"
            },
            "gateway": {
              "mode": "local",
              "bind": "lan",
              "controlUi": {
                "allowedOrigins": ["http://127.0.0.1:18789"],
                "allowInsecureAuth": true,
                "dangerouslyDisableDeviceAuth": true
              },
              "auth": { "mode": "token" }
            },
            "agents": {
              "defaults": {
                "memorySearch": { "enabled": false },
                "imageGenerationModel": { "primary": "openai/gpt-image-2" },
                "mediaGenerationAutoProviderFallback": false,
                "compaction": { "truncateAfterCompaction": false }
              },
              "list": [
                { "id": "main" },
                { "id": "borges" },
                { "id": "jeeves" },
                { "id": "babarsky" },
                { "id": "randal" },
                { "id": "glados" }
              ]
            },
            "plugins": {
              "entries": {
                "llm-task": {
                  "llm": {
                    "allowedCompletionModels": ["openai/gpt-4.1"]
                  }
                }
              }
            },
            "env": {
              "vars": {
                "PERSISTED_CONFIG_UPGRADE_SENTINEL": "preserve-me"
              }
            }
          }
          JSON

          partial_fixture_file=$(mktemp)
          cat > "$partial_fixture_file" <<'JSON'
          {
            "gateway": {
              "mode": "local",
              "bind": "lan",
              "controlUi": {
                "allowedOrigins": ["http://127.0.0.1:18789"]
              },
              "auth": { "mode": "token" }
            },
            "agents": {
              "entries": {
                "main": {
                  "memorySearch": { "provider": "auto" }
                }
              }
            },
            "env": {
              "vars": {
                "PERSISTED_CONFIG_PARTIAL_SENTINEL": "preserve-me"
              }
            }
          }
          JSON

          mixed_invalid_fixture_file=$(mktemp)
          cat > "$mixed_invalid_fixture_file" <<'JSON'
          {
            "gateway": {
              "mode": "local",
              "bind": "lan",
              "controlUi": {
                "allowedOrigins": ["http://127.0.0.1:18789"]
              },
              "auth": { "mode": 99 }
            },
            "agents": {
              "entries": {
                "main": {
                  "memorySearch": { "provider": "auto" }
                }
              }
            },
            "env": {
              "vars": {
                "PERSISTED_CONFIG_MIXED_INVALID_SENTINEL": "preserve-me"
              }
            }
          }
          JSON

          seed_fixture() {
            target_volume=$1
            fixture=$2
            docker run --rm -i \
              --entrypoint /bin/sh \
              -v "$target_volume:/home/node/.openclaw" \
              "$DERIVED_IMAGE:smoke" \
              -ceu 'mkdir -p /home/node/.openclaw && cat > /home/node/.openclaw/openclaw.json' < "$fixture"
          }

          seed_fixture "$legacy_check_volume" "$fixture_file"
          seed_fixture "$dry_run_volume" "$fixture_file"
          seed_fixture "$auto_volume" "$fixture_file"
          seed_fixture "$partial_volume" "$partial_fixture_file"
          seed_fixture "$mixed_invalid_volume" "$mixed_invalid_fixture_file"

          docker run -d --name "$legacy_check_container" \
            -v "$legacy_check_volume:/home/node/.openclaw" \
            -e PUID=1000 -e PGID=1000 \
            -e OPENCLAW_SKIP_SYSTEM_PATH_REMAP=1 \
            -e OPENCLAW_GATEWAY_TOKEN=upgrade-smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e OPENCLAW_CONFIG_MIGRATION=check \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=upgrade-smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=upgrade-smoke-model \
            "$DERIVED_IMAGE:smoke"

          if ! wait_for_ready "$legacy_check_container"; then
            echo "UPGRADE SMOKE FAIL: legacy persisted check did not reach readiness through auto compatibility" 1>&2
            docker logs "$legacy_check_container" 2>&1 || true
            exit 1
          fi
          legacy_check_log=$(docker logs "$legacy_check_container" 2>&1 || true)
          echo "--- persisted-config legacy-check compatibility log ---"
          printf '%s\n' "$legacy_check_log"
          if ! printf '%s\n' "$legacy_check_log" | grep -Fq "$legacy_check_compatibility_marker"; then
            echo "UPGRADE SMOKE FAIL: legacy persisted check omitted its compatibility warning" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$legacy_check_log" | grep -Fq "$migration_required_marker"; then
            echo "UPGRADE SMOKE FAIL: legacy persisted check omitted the migration-required log" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$legacy_check_log" | grep -Fq "$candidate_validated_marker"; then
            echo "UPGRADE SMOKE FAIL: legacy persisted check did not validate its candidate" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$legacy_check_log" | grep -Fq "$migration_auto_marker"; then
            echo "UPGRADE SMOKE FAIL: legacy persisted check did not use the auto migration path" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$legacy_check_log" | grep -Fq 'applied migration'; then
            echo "UPGRADE SMOKE FAIL: legacy persisted check did not report migration completion" 1>&2
            exit 1
          fi
          if printf '%s\n' "$legacy_check_log" | grep -Fq '/tmp/openclaw-migration'; then
            echo "UPGRADE SMOKE FAIL: legacy persisted check exposed a temporary candidate path" 1>&2
            exit 1
          fi
          if ! docker exec "$legacy_check_container" test -e /home/node/.openclaw/.unraid-template-seeded; then
            echo "UPGRADE SMOKE FAIL: first-boot template seed did not run after legacy check compatibility migration" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$legacy_check_volume:/home/node/.openclaw" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const configDir = "/home/node/.openclaw";
            const backups = fs.readdirSync(configDir).filter((name) => /^openclaw\.json\.v2026\.8\.1-backup-.+/.test(name));
            if (backups.length !== 1) {
              console.error("UPGRADE SMOKE FAIL: legacy persisted check did not create exactly one real migration backup");
              process.exit(1);
            }
          '

          docker run -d --name "$dry_run_container" \
            -v "$dry_run_volume:/home/node/.openclaw" \
            -e PUID=1000 -e PGID=1000 \
            -e OPENCLAW_SKIP_SYSTEM_PATH_REMAP=1 \
            -e OPENCLAW_GATEWAY_TOKEN=upgrade-smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e OPENCLAW_CONFIG_MIGRATION=dry-run \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=upgrade-smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=upgrade-smoke-model \
            "$DERIVED_IMAGE:smoke"

          if ! wait_for_exit "$dry_run_container"; then
            echo "UPGRADE SMOKE FAIL: explicit migration dry-run did not refuse startup" 1>&2
            docker logs "$dry_run_container" 2>&1 || true
            exit 1
          fi
          dry_run_exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$dry_run_container")
          dry_run_log=$(docker logs "$dry_run_container" 2>&1 || true)
          echo "--- persisted-config explicit-dry-run log ---"
          printf '%s\n' "$dry_run_log"
          if [ "$dry_run_exit_code" = "0" ]; then
            echo "UPGRADE SMOKE FAIL: explicit migration dry-run exited successfully" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$dry_run_log" | grep -Fq "$migration_required_marker"; then
            echo "UPGRADE SMOKE FAIL: explicit migration dry-run omitted the migration-required log" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$dry_run_log" | grep -Fq "$dry_run_plan_marker"; then
            echo "UPGRADE SMOKE FAIL: explicit migration dry-run omitted the path-only plan" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$dry_run_log" | grep -Fq "$dry_run_refusal_marker"; then
            echo "UPGRADE SMOKE FAIL: explicit migration dry-run omitted its no-write refusal" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$dry_run_volume:/home/node/.openclaw" \
            -v "$fixture_file:/fixture:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const configDir = "/home/node/.openclaw";
            const fail = (message) => { console.error(`UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            if (!fs.readFileSync(`${configDir}/openclaw.json`).equals(fs.readFileSync("/fixture"))) {
              fail("explicit migration dry-run changed persisted config bytes");
            }
            const backups = fs.readdirSync(configDir).filter((name) => /^openclaw\.json\.v2026\.8\.1-backup-.+/.test(name));
            if (backups.length !== 0) fail("explicit migration dry-run created a backup");
          '

          docker run -d --name "$auto_container" \
            -v "$auto_volume:/home/node/.openclaw" \
            -e PUID=1000 -e PGID=1000 \
            -e OPENCLAW_SKIP_SYSTEM_PATH_REMAP=1 \
            -e OPENCLAW_GATEWAY_TOKEN=upgrade-smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=upgrade-smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=upgrade-smoke-model \
            "$DERIVED_IMAGE:smoke"

          if ! wait_for_ready "$auto_container"; then
            echo "UPGRADE SMOKE FAIL: default auto migration of the legacy fixture never reached readiness" 1>&2
            docker logs "$auto_container" 2>&1 || true
            exit 1
          fi
          auto_log=$(docker logs "$auto_container" 2>&1 || true)
          echo "--- persisted-config default-auto legacy log ---"
          printf '%s\n' "$auto_log"
          if ! printf '%s\n' "$auto_log" | grep -Fq "$migration_required_marker"; then
            echo "UPGRADE SMOKE FAIL: default auto migration omitted the migration-required log" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$auto_log" | grep -Fq "$candidate_validated_marker"; then
            echo "UPGRADE SMOKE FAIL: default auto migration did not validate its candidate" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$auto_log" | grep -Fq "$migration_auto_marker"; then
            echo "UPGRADE SMOKE FAIL: default auto migration omitted the auto-apply log" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$auto_log" | grep -Fq 'applied migration'; then
            echo "UPGRADE SMOKE FAIL: default auto migration did not report completion" 1>&2
            exit 1
          fi
          if ! docker exec "$auto_container" test -e /home/node/.openclaw/.unraid-template-seeded; then
            echo "UPGRADE SMOKE FAIL: first-boot template seed did not run after default auto migration" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$auto_volume:/home/node/.openclaw" \
            -v "$fixture_file:/fixture:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const configDir = "/home/node/.openclaw";
            const fail = (message) => { console.error(`UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const expectedAgentIds = ["main", "borges", "jeeves", "babarsky", "randal", "glados"];
            const expectedAllowlist = ["openai/gpt-4.1"];

            const backups = fs.readdirSync(configDir).filter((name) => /^openclaw\.json\.v2026\.8\.1-backup-.+/.test(name));
            if (backups.length !== 1) fail("default auto migration did not create exactly one backup");
            const backupPath = `${configDir}/${backups[0]}`;
            if (!fs.statSync(backupPath).isFile() || fs.statSync(backupPath).size === 0) fail("narrow migration backup is empty");
            if (!fs.readFileSync(backupPath).equals(fs.readFileSync("/fixture"))) fail("narrow migration backup is not byte-identical to the fixture");
            const backup = JSON.parse(fs.readFileSync(backupPath, "utf8"));
            if (backup.meta?.lastTouchedAt !== "2026-08-01T00:00:00.000Z") fail("migration backup did not preserve meta.lastTouchedAt");
            if (backup.gateway?.controlUi?.allowInsecureAuth !== true) fail("migration backup did not preserve allowInsecureAuth");
            if (backup.gateway?.controlUi?.dangerouslyDisableDeviceAuth !== true) fail("migration backup did not preserve dangerouslyDisableDeviceAuth");
            if (backup.agents?.defaults?.memorySearch?.enabled !== false) fail("migration backup did not preserve memorySearch");
            if (backup.agents?.defaults?.imageGenerationModel?.primary !== "openai/gpt-image-2") fail("migration backup did not preserve imageGenerationModel");
            if (backup.agents?.defaults?.mediaGenerationAutoProviderFallback !== false) fail("migration backup did not preserve mediaGenerationAutoProviderFallback");
            if (backup.agents?.defaults?.compaction?.truncateAfterCompaction !== false) fail("migration backup did not preserve truncateAfterCompaction");
            if (backup.env?.vars?.PERSISTED_CONFIG_UPGRADE_SENTINEL !== "preserve-me") fail("migration backup did not preserve the sentinel");
            if (JSON.stringify(backup.agents?.list?.map((entry) => entry.id)) !== JSON.stringify(expectedAgentIds)) fail("migration backup did not preserve the legacy agent roster");
            if (backup.agents?.ownership !== undefined) fail("migration backup did not preserve markerless agent ownership");
            if (backup.agents?.list?.some((entry) => Object.hasOwn(entry, "default"))) fail("migration backup did not preserve markerless agents");
            const backupLlm = backup.plugins?.entries?.["llm-task"]?.llm;
            if (JSON.stringify(backupLlm?.allowedCompletionModels) !== JSON.stringify(expectedAllowlist)) fail("migration backup did not preserve llm allowedCompletionModels");
            if (backupLlm?.allowModelOverride !== undefined || backupLlm?.allowAuthProfileOverride !== undefined) fail("migration backup did not preserve missing llm override policy");

            const config = JSON.parse(fs.readFileSync(`${configDir}/openclaw.json`, "utf8"));
            const expectedMigratedAgentIds = expectedAgentIds.slice().sort();
            if (config.meta?.lastTouchedAt !== undefined) fail("retired meta.lastTouchedAt remains");
            if (config.gateway?.controlUi?.allowInsecureAuth !== undefined) fail("retired gateway.controlUi.allowInsecureAuth remains");
            if (config.gateway?.controlUi?.dangerouslyDisableDeviceAuth !== undefined) fail("retired gateway.controlUi.dangerouslyDisableDeviceAuth remains");
            if (config.agents?.defaults?.memorySearch !== undefined) fail("legacy agents.defaults.memorySearch remains");
            if (config.memory?.search?.enabled !== false) fail("agents.defaults.memorySearch was not moved to memory.search");
            if (config.agents?.defaults?.imageGenerationModel !== undefined) fail("legacy agents.defaults.imageGenerationModel remains");
            if (config.agents?.defaults?.mediaModels?.image?.primary !== "openai/gpt-image-2") fail("imageGenerationModel was not moved to agents.defaults.mediaModels.image");
            if (config.agents?.defaults?.mediaGenerationAutoProviderFallback !== undefined) fail("retired agents.defaults.mediaGenerationAutoProviderFallback remains");
            if (config.agents?.defaults?.compaction?.truncateAfterCompaction !== undefined) fail("retired agents.defaults.compaction.truncateAfterCompaction remains");
            if (config.env?.vars?.PERSISTED_CONFIG_UPGRADE_SENTINEL !== "preserve-me") fail("preservation sentinel changed during migration");
            if (config.agents?.list !== undefined) fail("legacy agents.list remains");
            const entries = config.agents?.entries;
            if (!entries || typeof entries !== "object" || Array.isArray(entries)) fail("agent roster was not converted to keyed entries");
            if (JSON.stringify(Object.keys(entries).sort()) !== JSON.stringify(expectedMigratedAgentIds)) fail("keyed agent roster changed during migration");
            const hasRetiredRosterField = Object.values(entries).some(
              (entry) => !entry || typeof entry !== "object" || Object.hasOwn(entry, "id") || Object.hasOwn(entry, "default")
            );
            if (hasRetiredRosterField) fail("retired agent roster markers remain");
            if (config.agents?.ownership !== "explicit") fail("markerless multi-agent ownership was not made explicit");
            const llm = config.plugins?.entries?.["llm-task"]?.llm;
            if (llm?.allowModelOverride !== true) fail("llm allowModelOverride was not enabled");
            if (llm?.allowAuthProfileOverride !== true) fail("llm allowAuthProfileOverride was not enabled");
            if (JSON.stringify(llm?.allowedCompletionModels) !== JSON.stringify(expectedAllowlist)) fail("llm allowedCompletionModels changed during migration");
          '
          if ! gateway_ready "$auto_container"; then
            echo "UPGRADE SMOKE FAIL: gateway lost readiness after default auto migration assertions" 1>&2
            exit 1
          fi

          docker stop -t 15 "$auto_container" >/dev/null
          docker rm "$auto_container" >/dev/null
          docker run -d --name "$restart_container" \
            -v "$auto_volume:/home/node/.openclaw" \
            -e PUID=1000 -e PGID=1000 \
            -e OPENCLAW_SKIP_SYSTEM_PATH_REMAP=1 \
            -e OPENCLAW_GATEWAY_TOKEN=upgrade-smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=upgrade-smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=upgrade-smoke-model \
            "$DERIVED_IMAGE:smoke"

          if ! wait_for_ready "$restart_container"; then
            echo "UPGRADE SMOKE FAIL: valid default restart never reached readiness" 1>&2
            docker logs "$restart_container" 2>&1 || true
            exit 1
          fi
          restart_log=$(docker logs "$restart_container" 2>&1 || true)
          echo "--- persisted-config default restart log ---"
          printf '%s\n' "$restart_log"
          if printf '%s\n' "$restart_log" | grep -Fq "$migration_required_marker"; then
            echo "UPGRADE SMOKE FAIL: valid default restart requested migration" 1>&2
            exit 1
          fi
          if printf '%s\n' "$restart_log" | grep -Fq "$migration_auto_marker"; then
            echo "UPGRADE SMOKE FAIL: valid default restart applied migration" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$auto_volume:/home/node/.openclaw" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const configDir = "/home/node/.openclaw";
            const backups = fs.readdirSync(configDir).filter((name) => /^openclaw\.json\.v2026\.8\.1-backup-.+/.test(name));
            if (backups.length !== 1) {
              console.error("UPGRADE SMOKE FAIL: valid default restart created a second migration backup");
              process.exit(1);
            }
          '

          docker run -d --name "$partial_container" \
            -v "$partial_volume:/home/node/.openclaw" \
            -e PUID=1000 -e PGID=1000 \
            -e OPENCLAW_SKIP_SYSTEM_PATH_REMAP=1 \
            -e OPENCLAW_GATEWAY_TOKEN=upgrade-smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=upgrade-smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=upgrade-smoke-model \
            "$DERIVED_IMAGE:smoke"

          if ! wait_for_ready "$partial_container"; then
            echo "UPGRADE SMOKE FAIL: default auto migration of the partial fixture never reached readiness" 1>&2
            docker logs "$partial_container" 2>&1 || true
            exit 1
          fi
          partial_log=$(docker logs "$partial_container" 2>&1 || true)
          echo "--- persisted-config default-auto partial log ---"
          printf '%s\n' "$partial_log"
          if ! printf '%s\n' "$partial_log" | grep -Fq "$migration_required_marker"; then
            echo "UPGRADE SMOKE FAIL: partial auto migration omitted the migration-required log" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$partial_log" | grep -Fq "$candidate_validated_marker"; then
            echo "UPGRADE SMOKE FAIL: partial auto migration did not validate its candidate" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$partial_log" | grep -Fq "$migration_auto_marker"; then
            echo "UPGRADE SMOKE FAIL: partial auto migration omitted the auto-apply log" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$partial_log" | grep -Fq 'applied migration'; then
            echo "UPGRADE SMOKE FAIL: partial auto migration did not report completion" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$partial_volume:/home/node/.openclaw" \
            -v "$partial_fixture_file:/fixture:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const configDir = "/home/node/.openclaw";
            const fail = (message) => { console.error(`UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const backups = fs.readdirSync(configDir).filter((name) => /^openclaw\.json\.v2026\.8\.1-backup-.+/.test(name));
            if (backups.length !== 1) fail("partial auto migration did not create exactly one backup");
            if (!fs.readFileSync(`${configDir}/${backups[0]}`).equals(fs.readFileSync("/fixture"))) fail("partial auto migration backup is not byte-identical to the fixture");
            const config = JSON.parse(fs.readFileSync(`${configDir}/openclaw.json`, "utf8"));
            if (config.env?.vars?.PERSISTED_CONFIG_PARTIAL_SENTINEL !== "preserve-me") fail("partial migration changed the sentinel");
            const main = config.agents?.entries?.main;
            if (main?.memorySearch !== undefined) fail("partial migration left agents.entries.main.memorySearch");
            if (main?.memory?.search?.provider !== "openai") fail("partial migration did not canonicalize the memory provider");
          '

          docker run -d --name "$mixed_invalid_container" \
            -v "$mixed_invalid_volume:/home/node/.openclaw" \
            -e PUID=1000 -e PGID=1000 \
            -e OPENCLAW_SKIP_SYSTEM_PATH_REMAP=1 \
            -e OPENCLAW_GATEWAY_TOKEN=upgrade-smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=upgrade-smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=upgrade-smoke-model \
            "$DERIVED_IMAGE:smoke"

          if ! wait_for_exit "$mixed_invalid_container"; then
            echo "UPGRADE SMOKE FAIL: mixed invalid+migratable config did not refuse default auto startup" 1>&2
            docker logs "$mixed_invalid_container" 2>&1 || true
            exit 1
          fi
          mixed_invalid_exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$mixed_invalid_container")
          mixed_invalid_log=$(docker logs "$mixed_invalid_container" 2>&1 || true)
          echo "--- persisted-config default-auto mixed-invalid log ---"
          printf '%s\n' "$mixed_invalid_log"
          if [ "$mixed_invalid_exit_code" = "0" ]; then
            echo "UPGRADE SMOKE FAIL: mixed invalid+migratable config default auto startup exited successfully" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$mixed_invalid_log" | grep -Fq "$migration_required_marker"; then
            echo "UPGRADE SMOKE FAIL: mixed invalid+migratable config omitted the migration-required log" 1>&2
            exit 1
          fi
          if ! printf '%s\n' "$mixed_invalid_log" | grep -Fq "$candidate_validation_marker"; then
            echo "UPGRADE SMOKE FAIL: mixed invalid+migratable config omitted the candidate-validation refusal" 1>&2
            exit 1
          fi
          if printf '%s\n' "$mixed_invalid_log" | grep -Fq '/tmp/openclaw-migration'; then
            echo "UPGRADE SMOKE FAIL: mixed invalid+migratable config exposed a temporary candidate path" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$mixed_invalid_volume:/home/node/.openclaw" \
            -v "$mixed_invalid_fixture_file:/fixture:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const configDir = "/home/node/.openclaw";
            const fail = (message) => { console.error(`UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            if (!fs.readFileSync(`${configDir}/openclaw.json`).equals(fs.readFileSync("/fixture"))) {
              fail("mixed invalid+migratable default auto migration changed persisted config bytes");
            }
            const backups = fs.readdirSync(configDir).filter((name) => /^openclaw\.json\.v2026\.8\.1-backup-.+/.test(name));
            if (backups.length !== 0) fail("mixed invalid+migratable default auto migration created a real backup");
          '
          if docker export "$mixed_invalid_container" | tar -tf - | grep -Fq 'tmp/openclaw-migration'; then
            echo "UPGRADE SMOKE FAIL: mixed invalid+migratable config left temporary candidate artifacts behind" 1>&2
            exit 1
          fi
          echo "PERSISTED-CONFIG UPGRADE SMOKE OK"

      # Push happens only after the smoke gate passed (cache hit — instant).
      - name: Push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENCLAW_TAG=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          tags: |
            ${{ env.DERIVED_IMAGE }}:latest
            ${{ steps.tag.outputs.tag != 'latest' && format('{0}:{1}', env.DERIVED_IMAGE, steps.tag.outputs.tag) || '' }}

  # FAILURE REGISTRATION: when Issues are enabled, file (or update) a
  # deduplicated issue. Standard Actions failure notification email remains
  # available regardless; follow-up failures add comments to the open issue.
  on-failure:
    runs-on: ubuntu-latest
    needs: [build]
    if: failure() && github.event.repository.has_issues
    permissions:
      issues: write
    steps:
      - name: File or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Automated rebuild failed (${{ github.event_name }})"
          BODY="Derived-image build/smoke failed.

          - Run: $RUN_URL
          - Trigger: ${{ github.event_name }}
          - Upstream digest: ${{ needs.build.outputs.upstream_digest || 'n/a (failed before digest capture)' }}

          :latest was NOT updated — deployments keep the previous image.
          Check the smoke log in the run; likely an upstream image layout change
          (entrypoint paths, config CLI, node user) that docker/unraid-entrypoint.sh
          must adapt to."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Still failing: $RUN_URL (upstream digest: ${{ needs.build.outputs.upstream_digest || 'n/a' }})"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY" --label bug
          fi
