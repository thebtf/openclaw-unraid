            echo "WORKSPACE UPGRADE SMOKE FAIL: restart log disclosed a persisted value" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$workspace_volume:/home/node/.openclaw:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { DatabaseSync } = require("node:sqlite");
            const fail = (message) => { console.error(`WORKSPACE UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const sourceName = "openclaw-workspace-state.json";
            const backupSuffix = ".openclaw-2026.8.1-pre-migration.bak";
            const agentIds = ["borges", "jeeves", "babarsky", "randal", "glados"];
            const expectedBackups = new Set();
            for (const agent of agentIds) {
              const workspace = path.join(configDir, `workspace-${agent}`);
              const source = path.join(workspace, sourceName);
              const backup = `${source}${backupSuffix}`;
              expectedBackups.add(backup);
              if (fs.existsSync(source) || fs.existsSync(`${source}.doctor-importing`)) fail(`restart restored a retired source for ${agent}`);
              if (!fs.lstatSync(backup).isFile()) fail(`restart lost the verified backup for ${agent}`);
            }
            const actualBackups = agentIds.flatMap((agent) => {
              const workspace = path.join(configDir, `workspace-${agent}`);
              return fs.readdirSync(workspace)
                .filter((name) => name.endsWith(backupSuffix))
                .map((name) => path.join(workspace, name));
            });
            if (actualBackups.length !== expectedBackups.size || actualBackups.some((backup) => !expectedBackups.has(backup))) {
              fail("restart created a second or unexpected workspace migration backup");
            }
            const db = new DatabaseSync(path.join(configDir, "state", "openclaw.sqlite"), { readOnly: true });
            try {
              const receiptCount = db.prepare(
                "SELECT COUNT(*) AS count FROM migration_sources WHERE migration_kind = ? AND target_table = ?"
              ).get("legacy-workspace-setup-files", "workspace_setup_state").count;
              if (Number(receiptCount) !== agentIds.length) fail("restart created an additional workspace import receipt");
            } finally {
              db.close();
            }
          '

          docker run --rm --entrypoint /bin/sh \
            -v "$refusal_volume:/home/node/.openclaw" \
            -v "$workspace_fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" \
            -ceu '
              mkdir -p /home/node/.openclaw/workspace-borges
              cp /fixtures/openclaw.json /home/node/.openclaw/openclaw.json
              cp /fixtures/refusal-target.json /home/node/.openclaw/workspace-refusal-target.json
              ln -s ../workspace-refusal-target.json /home/node/.openclaw/workspace-borges/openclaw-workspace-state.json
            '
          docker run --rm --entrypoint node \
            -v "$refusal_volume:/home/node/.openclaw:ro" \
            -v "$workspace_fixture_dir:/fixtures" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const source = "/home/node/.openclaw/workspace-borges/openclaw-workspace-state.json";
            const stat = fs.lstatSync(source);
            fs.writeFileSync("/fixtures/refusal-source-identity.json", JSON.stringify({
