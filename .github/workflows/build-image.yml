          cat > "$session_fixture_dir/openclaw.json" <<JSON
          {"gateway":{"mode":"local","bind":"lan","controlUi":{"allowedOrigins":["http://127.0.0.1:18789"]},"auth":{"mode":"token"}},"agents":{"entries":{"main":{"default":true},"borges":{},"glados":{}}},"env":{"vars":{"SESSION_STORE_SMOKE_SECRET":"$session_config_secret"}}}
          JSON
          make_legacy_source() {
            agent=$1; session_id=$2
            cat > "$session_fixture_dir/$agent-sessions.json" <<JSON
          {"agent:$agent:main":{"channel":"cli","chatType":"direct","sessionFile":"$agent-session.jsonl","sessionId":"$session_id","sessionStartedAt":1000,"updatedAt":2000}}
          JSON
            cat > "$session_fixture_dir/$agent-session.jsonl" <<JSON
          {"type":"session","sessionId":"$session_id"}
          {"type":"event","id":"event-$agent"}
          JSON
          }
          make_legacy_source main main-sentinel-session
          make_legacy_source borges borges-import-session
          printf '%s\n' '{"agent:borges:main":' > "$session_fixture_dir/malformed-sessions.json"
          printf '%s\n' '{}' > "$session_fixture_dir/glados-sessions.json"
          cat > "$session_fixture_dir/oversized-doctor-report.mjs" <<'JS'
          process.stdout.write("x".repeat(64 * 1024 * 1024 + 1));
          JS

          docker volume create "$session_volume" >/dev/null
          docker volume create "$session_refusal_volume" >/dev/null
          if oversized_output=$(docker run --rm --user 1000:1000 --entrypoint node \
            -v "$session_fixture_dir/oversized-doctor-report.mjs:/app/dist/index.js:ro" \
            "$DERIVED_IMAGE:smoke" /usr/local/bin/migrate-openclaw-legacy-sessions.mjs 2>/dev/null); then
            echo "SESSION STORE UPGRADE SMOKE FAIL: helper accepted oversized Doctor output" 1>&2
            exit 1
          fi
