              cp /fixtures/glados-sessions.json /home/node/.openclaw/agents/glados/sessions/sessions.json
              chown -R 1000:1000 /home/node/.openclaw/agents/borges /home/node/.openclaw/agents/glados
            '

          start_session_gateway "$session_container" "$session_volume"
          if ! wait_for_ready "$session_container"; then
            echo "SESSION STORE UPGRADE SMOKE FAIL: migrated session fixture did not reach readiness; logs withheld to protect persisted values" 1>&2
            exit 1
          fi
