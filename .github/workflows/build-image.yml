            exit 1
          fi
          absent_config_dry_run_exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$absent_config_dry_run_container")
          absent_config_dry_run_log=$(docker logs "$absent_config_dry_run_container" 2>&1 || true)
          if [ "$absent_config_dry_run_exit_code" = "0" ]; then
