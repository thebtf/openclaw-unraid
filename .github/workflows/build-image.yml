          if ! docker run --rm --user 1000:1000 --entrypoint node \
            -v "$session_volume:/home/node/.openclaw" \
            "$DERIVED_IMAGE:smoke" /app/dist/index.js doctor --session-sqlite import --session-sqlite-all-agents --json \
            > "$session_fixture_dir/seed-report.json" 2> "$session_fixture_dir/seed-error.log"; then
            echo "SESSION STORE UPGRADE SMOKE FAIL: public seed importer did not complete" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint /bin/sh \
            -v "$session_volume:/home/node/.openclaw" \
            -v "$session_fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" -ceu '
              mkdir -p /home/node/.openclaw/agents/borges/sessions /home/node/.openclaw/agents/glados/sessions
