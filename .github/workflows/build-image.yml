                }
              } finally {
                db.close();
              }
            }
          '

          start_workspace_gateway "$workspace_container" "$workspace_volume"
          if ! wait_for_ready "$workspace_container"; then
            echo "WORKSPACE UPGRADE SMOKE FAIL: valid keyed multi-workspace fixture did not reach readiness; logs withheld to protect persisted values" 1>&2
            exit 1
          fi
          workspace_log=$(docker logs "$workspace_container" 2>&1 || true)
          if [ "$(printf '%s\n' "$workspace_log" | grep -Fxc '[bootstrap] workspace-migration: applied' || true)" != "1" ]; then
            echo "WORKSPACE UPGRADE SMOKE FAIL: valid fixture did not emit exactly one applied workspace-migration marker" 1>&2
            exit 1
          fi
          if printf '%s\n' "$workspace_log" | grep -Fq "$workspace_config_secret" || printf '%s\n' "$workspace_log" | grep -Fq "$workspace_source_secret"; then
            echo "WORKSPACE UPGRADE SMOKE FAIL: workspace migration log disclosed a persisted value" 1>&2
            exit 1
          fi

          docker run --rm --entrypoint node \
            -v "$workspace_volume:/home/node/.openclaw:ro" \
            -v "$workspace_fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const { DatabaseSync } = require("node:sqlite");
            const fail = (message) => { console.error(`WORKSPACE UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const sourceName = "openclaw-workspace-state.json";
            const backupSuffix = ".openclaw-2026.8.1-pre-migration.bak";
            const agentIds = ["borges", "jeeves", "babarsky", "randal", "glados"];
            const expected = new Map(agentIds.map((agent) => {
              const workspace = path.join(configDir, `workspace-${agent}`);
              const fixture = fs.readFileSync(`/fixtures/${agent}.json`);
              return [workspace, { fixture, state: JSON.parse(fixture) }];
            }));
            const sha256 = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
            for (const [workspace, { fixture }] of expected) {
              const source = path.join(workspace, sourceName);
              const backup = `${source}${backupSuffix}`;
              if (fs.existsSync(source)) fail(`retired source remains at ${source}`);
              if (fs.existsSync(`${source}.doctor-importing`)) fail(`upstream claim remains at ${source}`);
              const backupStat = fs.lstatSync(backup);
              if (!backupStat.isFile() || backupStat.nlink !== 1) fail(`backup is not an independent regular file at ${backup}`);
              if (!fs.readFileSync(backup).equals(fixture)) fail(`backup is not byte-identical at ${backup}`);
            }
            const dbPath = path.join(configDir, "state", "openclaw.sqlite");
            if (!fs.lstatSync(dbPath).isFile()) fail("upstream workspace SQLite state is missing");
            const db = new DatabaseSync(dbPath, { readOnly: true });
            try {
              const setupRows = db.prepare(`
                SELECT workspace_key, workspace_path, version, bootstrap_seeded_at, setup_completed_at
                FROM workspace_setup_state
                WHERE workspace_path IN (${agentIds.map(() => "?").join(",")})
              `).all(...expected.keys());
              if (setupRows.length !== expected.size) fail("SQLite setup state does not contain one row for every migrated workspace");
              for (const row of setupRows) {
                const wanted = expected.get(row.workspace_path);
                if (!wanted) fail(`SQLite setup state has an unexpected workspace path ${row.workspace_path}`);
                const workspaceKey = sha256(row.workspace_path);
                if (row.workspace_key !== workspaceKey) fail(`SQLite workspace key is not canonical for ${row.workspace_path}`);
                if (Number(row.version) !== 1) fail(`SQLite setup state version is invalid for ${row.workspace_path}`);
                if (row.bootstrap_seeded_at !== wanted.state.bootstrapSeededAt || row.setup_completed_at !== wanted.state.setupCompletedAt) {
                  fail(`SQLite setup timestamps differ from the imported source for ${row.workspace_path}`);
                }
              }
              const receipts = db.prepare(`
                SELECT source_path, source_sha256, source_record_count, removed_source, report_json
                FROM migration_sources
                WHERE migration_kind = ? AND target_table = ?
                ORDER BY source_path
              `).all("legacy-workspace-setup-files", "workspace_setup_state");
              if (receipts.length !== expected.size) fail("SQLite does not contain exactly one import receipt per setup source");
              const resolutions = new Set(["inserted", "merged", "replaced", "verified", "superseded"]);
              for (const [workspace, { fixture }] of expected) {
                const source = path.join(workspace, sourceName);
                const receipt = receipts.find((candidate) => candidate.source_path === source);
                if (!receipt) fail(`SQLite receipt is missing for ${source}`);
                if (receipt.source_sha256 !== sha256(fixture) || Number(receipt.source_record_count) !== 2 || Number(receipt.removed_source) !== 1) {
                  fail(`SQLite receipt is not authoritative for ${source}`);
                }
                const report = JSON.parse(receipt.report_json);
                if (report.sourceKind !== "setup" || report.authoritative !== true || report.imported !== true || !resolutions.has(report.resolution)) {
                  fail(`SQLite receipt report is not an authoritative setup import for ${source}`);
                }
              }
            } finally {
              db.close();
            }
