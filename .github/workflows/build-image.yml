            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { DatabaseSync } = require("node:sqlite");
            const fail = (message) => { console.error(`SESSION STORE UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const mainDb = path.join(configDir, "agents", "main", "agent", "openclaw-agent.sqlite");
            const borgesDb = path.join(configDir, "agents", "borges", "agent", "openclaw-agent.sqlite");
            const borgesStore = path.join(configDir, "agents", "borges", "sessions", "sessions.json");
            const gladosStore = path.join(configDir, "agents", "glados", "sessions", "sessions.json");
            const borgesTranscript = path.join(configDir, "agents", "borges", "sessions", "borges-session.jsonl");
            const manifestPaths = (directory) => !fs.existsSync(directory) ? [] : fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const child = path.join(directory, entry.name);
              return entry.isDirectory() ? manifestPaths(child) : entry.isFile() && entry.name.endsWith(".json") ? [child] : [];
            });
            const manifests = manifestPaths(path.join(configDir, "session-sqlite-migration-runs")).sort().map((manifestPath) => ({ manifestPath, manifest: JSON.parse(fs.readFileSync(manifestPath, "utf8")) }));
            if (manifests.length !== 2) fail("expected one public seed and one helper migration manifest");
            const borgesManifest = manifests.find(({ manifest }) => Array.isArray(manifest.targets) && manifest.targets.some((target) => Array.isArray(target?.plannedMoves) && target.plannedMoves.some((move) => move?.sourcePath === borgesStore)));
            const storeMove = borgesManifest?.manifest.targets.flatMap((target) => Array.isArray(target?.plannedMoves) ? target.plannedMoves : []).find((move) => move?.sourcePath === borgesStore);
            const gladosStoreMove = borgesManifest?.manifest.targets.flatMap((target) => Array.isArray(target?.plannedMoves) ? target.plannedMoves : []).find((move) => move?.sourcePath === gladosStore);
            if (!storeMove || !gladosStoreMove || typeof storeMove.archivePath !== "string" || !fs.lstatSync(storeMove.archivePath).isFile() || typeof gladosStoreMove.archivePath !== "string" || !fs.lstatSync(gladosStoreMove.archivePath).isFile()) fail("helper migration did not publish an upstream archive for every legacy store");
            if (fs.existsSync(borgesStore) || fs.existsSync(borgesTranscript) || fs.existsSync(gladosStore)) fail("helper migration left a legacy source behind");
            const postflight = JSON.parse(fs.readFileSync("/fixtures/postflight.json", "utf8"));
            if (postflight.mode !== "dry-run" || postflight.totals?.targets !== 0 || postflight.totals?.issues !== 0 || postflight.totals?.legacyEntries !== 0) fail("postflight did not report zero legacy targets");
            const assertEntry = (databasePath, sessionKey, sessionId) => {
              const database = new DatabaseSync(databasePath, { readOnly: true });
              try {
                const row = database.prepare("SELECT COUNT(*) AS count, MIN(current_session_id) AS session_id FROM session_nodes WHERE session_key = ?").get(sessionKey);
                if (Number(row.count) !== 1 || row.session_id !== sessionId) fail("canonical SQLite sentinel or imported session is missing");
              } finally {
                database.close();
              }
            };
            assertEntry(mainDb, "agent:main:main", "main-sentinel-session");
            assertEntry(borgesDb, "agent:borges:main", "borges-import-session");
            for (const artifact of [mainDb, borgesDb, borgesManifest.manifestPath, storeMove.archivePath, gladosStoreMove.archivePath]) {
              const stat = fs.lstatSync(artifact);
              if (stat.uid !== 1000 || stat.gid !== 1000) fail("session migration artifact is not PUID-owned");
            }
            fs.writeFileSync("/fixtures/migrated-session-state.json", JSON.stringify({ manifestPaths: manifests.map(({ manifestPath }) => manifestPath) }));
          '

          docker stop -t 15 "$session_container" >/dev/null
          docker rm "$session_container" >/dev/null
          start_session_gateway "$session_restart_container" "$session_volume"
          if ! wait_for_ready "$session_restart_container"; then
            echo "SESSION STORE UPGRADE SMOKE FAIL: migrated session restart did not reach readiness; logs withheld to protect persisted values" 1>&2
            exit 1
          fi
          restart_log=$(docker logs "$session_restart_container" 2>&1 || true)
          if [ "$(printf '%s\n' "$restart_log" | grep -Fxc '[bootstrap] session-migration: no-op' || true)" != "1" ]; then
            echo "SESSION STORE UPGRADE SMOKE FAIL: restart did not emit exactly one session-migration no-op" 1>&2
            exit 1
          fi
          if printf '%s\n' "$restart_log" | grep -Fq "$session_config_secret" || printf '%s\n' "$restart_log" | grep -Fq '"targets"'; then
            echo "SESSION STORE UPGRADE SMOKE FAIL: restart log disclosed a fixture value or raw Doctor report" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$session_volume:/home/node/.openclaw:ro" \
            -v "$session_fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { DatabaseSync } = require("node:sqlite");
            const fail = (message) => { console.error(`SESSION STORE UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const manifestPaths = (directory) => !fs.existsSync(directory) ? [] : fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
