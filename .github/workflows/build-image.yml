            -v "$compatibility_volume:/home/node/.openclaw:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { DatabaseSync } = require("node:sqlite");
            const fail = (message) => { console.error(`EXEC APPROVALS/DEFAULT-ROLE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const source = path.join(configDir, "exec-approvals.json");
            const backups = fs.readdirSync(configDir).filter((name) => name === "exec-approvals.json.openclaw-2026.8.2-pre-migration.bak");
            if (backups.length !== 1 || fs.existsSync(source) || fs.existsSync(`${source}.doctor-importing`)) fail("restart changed the retired exec approvals source or backup set");
            const config = JSON.parse(fs.readFileSync(path.join(configDir, "openclaw.json"), "utf8"));
            const telegramWildcards = (config.bindings ?? []).filter((binding) => binding?.agentId === "main" && binding?.match?.channel === "telegram" && binding?.match?.accountId === "*");
            if (telegramWildcards.length !== 1) fail("restart duplicated the main Telegram wildcard");
            const db = new DatabaseSync(path.join(configDir, "state", "openclaw.sqlite"), { readOnly: true });
            try {
              const rowCount = db.prepare("SELECT COUNT(*) AS count FROM exec_approvals_config WHERE config_key = ?").get("current").count;
              const receiptCount = db.prepare("SELECT COUNT(*) AS count FROM migration_sources WHERE migration_kind = ? AND target_table = ?").get("legacy-exec-approvals-json", "exec_approvals_config").count;
              if (Number(rowCount) !== 1 || Number(receiptCount) !== 1) fail("restart duplicated exec approvals canonical state or receipt");
            } finally {
              db.close();
            }
          '

          docker run --rm --entrypoint /bin/sh \
            -v "$refusal_volume:/home/node/.openclaw" \
            -v "$fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" -ceu '
              mkdir -p /home/node/.openclaw
              cp /fixtures/malformed-exec-approvals.json /home/node/.openclaw/exec-approvals.json
              chown -R 1000:1000 /home/node/.openclaw
            '
          start_gateway "$refusal_container" "$refusal_volume"
          if ! wait_for_exit "$refusal_container"; then
            echo "EXEC APPROVALS/DEFAULT-ROLE SMOKE FAIL: malformed approvals source did not refuse before gateway startup; logs withheld to protect persisted values" 1>&2
            exit 1
          fi
          refusal_exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$refusal_container")
          refusal_log=$(docker logs "$refusal_container" 2>&1 || true)
          if [ "$refusal_exit_code" = "0" ]; then
            echo "EXEC APPROVALS/DEFAULT-ROLE SMOKE FAIL: malformed approvals source exited successfully" 1>&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$refusal_log" | grep -Ec '^\[bootstrap\] exec-approvals-migration: refused code=[a-z0-9-]+$' || true)" != "1" ]; then
            echo "EXEC APPROVALS/DEFAULT-ROLE SMOKE FAIL: malformed approvals source omitted its bounded refusal" 1>&2
            exit 1
          fi
          if printf '%s\n' "$refusal_log" | grep -Fq "$malformed_secret" || printf '%s\n' "$refusal_log" | grep -Fq '"changes"'; then
            echo "EXEC APPROVALS/DEFAULT-ROLE SMOKE FAIL: malformed approvals log disclosed a fixture value or raw migration report" 1>&2
            exit 1
          fi
          docker run --rm --entrypoint node \
            -v "$refusal_volume:/home/node/.openclaw" \
            -v "$fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { DatabaseSync } = require("node:sqlite");
            const fail = (message) => { console.error(`EXEC APPROVALS/DEFAULT-ROLE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const source = path.join(configDir, "exec-approvals.json");
            const backup = `${source}.openclaw-2026.8.2-pre-migration.bak`;
            if (fs.existsSync(path.join(configDir, "openclaw.json"))) fail("malformed approvals source reached config creation");
            if (!fs.readFileSync(source).equals(fs.readFileSync("/fixtures/malformed-exec-approvals.json"))) fail("malformed approvals source bytes changed");
            if (fs.existsSync(`${source}.doctor-importing`)) fail("malformed approvals source left an upstream claim");
            const backupStat = fs.lstatSync(backup);
            if (!backupStat.isFile() || backupStat.nlink !== 1 || backupStat.uid !== 1000 || backupStat.gid !== 1000 || (backupStat.mode & 0o077) !== 0) fail("malformed approvals backup is not private and PUID-owned");
            if (!fs.readFileSync(backup).equals(fs.readFileSync("/fixtures/malformed-exec-approvals.json"))) fail("malformed approvals backup is not byte-identical");
            const dbPath = path.join(configDir, "state", "openclaw.sqlite");
            if (fs.existsSync(dbPath)) {
              const db = new DatabaseSync(dbPath, { readOnly: true });
              try {
                const tables = new Set(db.prepare("SELECT name FROM sqlite_master WHERE type = ? AND name = ?").all("table", "exec_approvals_config").map((row) => row.name));
                if (tables.has("exec_approvals_config") && Number(db.prepare("SELECT COUNT(*) AS count FROM exec_approvals_config").get().count) !== 0) fail("malformed approvals source created a canonical row");
              } finally {
                db.close();
              }
            }
          '
          echo "PERSISTED EXEC APPROVALS AND DEFAULT-ROLE SMOKE OK"

      # Push happens only after the smoke gate passed (cache hit — instant).
      - name: Push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENCLAW_TAG=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          tags: |
            ${{ env.DERIVED_IMAGE }}:latest
            ${{ steps.tag.outputs.tag != 'latest' && format('{0}:{1}', env.DERIVED_IMAGE, steps.tag.outputs.tag) || '' }}

  # FAILURE REGISTRATION: when Issues are enabled, file (or update) a
  # deduplicated issue. Standard Actions failure notification email remains
  # available regardless; follow-up failures add comments to the open issue.
  on-failure:
    runs-on: ubuntu-latest
    needs: [build]
    if: failure() && github.event.repository.has_issues
    permissions:
      issues: write
    steps:
      - name: File or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Automated rebuild failed (${{ github.event_name }})"
          BODY="Derived-image build/smoke failed.

          - Run: $RUN_URL
          - Trigger: ${{ github.event_name }}
          - Upstream digest: ${{ needs.build.outputs.upstream_digest || 'n/a (failed before digest capture)' }}

          :latest was NOT updated — deployments keep the previous image.
          Check the smoke log in the run; likely an upstream image layout change
          (entrypoint paths, config CLI, node user) that docker/unraid-entrypoint.sh
          must adapt to."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Still failing: $RUN_URL (upstream digest: ${{ needs.build.outputs.upstream_digest || 'n/a' }})"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY" --label bug
          fi
