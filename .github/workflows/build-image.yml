name: build-image

# Rebuild the derived image whenever upstream ghcr.io/openclaw/openclaw
# publishes a new digest, on template pushes, or manually.
#
# Tags published to ghcr.io/thebtf/openclaw-unraid:
#   latest            - tracks upstream :latest
#   <upstream-tag>    - when built from a pinned upstream tag (workflow input)
#
# Pipeline: drift check (cron) -> build local -> SMOKE -> push.
# The smoke gate boots the freshly built image with a throwaway config and
# requires the bootstrap to reach the gateway phase; a broken upstream
# change therefore never reaches :latest (deployments keep running the
# previous image). When repository Issues are enabled, a failure also files or
# updates a deduplicated "rebuild failed" issue; otherwise standard Actions
# failure notification email remains available.

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - docker/**
      - scripts/migrate-openclaw-2-config.py
      - .github/workflows/build-image.yml
  schedule:
    - cron: "23 5 * * *" # daily, off the :00 herd
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream openclaw tag to derive from"
        default: "latest"
        required: false

permissions:
  contents: read
  packages: write
  issues: write

env:
  UPSTREAM_IMAGE: ghcr.io/openclaw/openclaw
  DERIVED_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-unraid

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.gate.outputs.build }}
      upstream_digest: ${{ steps.base.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.upstream_tag || 'latest' }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether upstream digest changed (cron only)
        id: drift
        if: github.event_name == 'schedule'
        run: |
          UPSTREAM_DIGEST=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          OURS_BASE_DIGEST=$(docker buildx imagetools inspect "$DERIVED_IMAGE:latest" --format '{{json .}}' 2>/dev/null \
            | jq -r '..|.["org.opencontainers.image.base.digest"]? // empty' | head -1 || true)
          echo "upstream=$UPSTREAM_DIGEST ours_base=$OURS_BASE_DIGEST"
          if [ -n "$OURS_BASE_DIGEST" ] && [ "$UPSTREAM_DIGEST" = "$OURS_BASE_DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Single gate for every later step: push/dispatch always build;
      # cron builds only on digest drift.
      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.drift.outputs.changed }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Capture upstream digest for provenance label
        if: steps.gate.outputs.build == 'true'
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE:${{ steps.tag.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Build WITHOUT pushing: load into the runner's docker for the smoke gate.
      - name: Build (local, for smoke)
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            OPENCLAW_TAG=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          tags: ${{ env.DERIVED_IMAGE }}:smoke

      # SMOKE GATE: boot the image with throwaway config and require the
      # bootstrap to get through PUID remap + managed config keys and reach
      # the gateway phase. Catches every "loud" break class: entrypoint file
      # paths gone, config set CLI changed, node user renamed, setpriv missing.
      - name: Smoke test
        if: steps.gate.outputs.build == 'true'
        run: |
          set -eu
          docker run -d --name smoke \
            -e PUID=1234 -e PGID=1000 \
            -e OPENCLAW_GATEWAY_TOKEN=smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=smoke-model \
            "$DERIVED_IMAGE:smoke"

          # Bootstrap must reach the gateway exec line, and the container
          # must still be alive (not crash-looped) shortly after.
          ok=""
          for _ in $(seq 1 24); do
            if docker logs smoke 2>&1 | grep -q "dropping privileges to 1234:1000 and starting gateway"; then
              ok=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              break
            fi
            sleep 5
          done
          echo "--- bootstrap log ---"
          docker logs smoke 2>&1 | tail -60
          if [ -z "$ok" ]; then
            echo "SMOKE FAIL: bootstrap never reached the gateway phase" 1>&2
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
            echo "SMOKE FAIL: container died right after reaching gateway phase" 1>&2
            docker logs smoke 2>&1 | tail -40
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi
          # First-boot seed marker must exist (CUSTOM_LLM_* was set).
          docker exec smoke sh -c 'test -f /home/node/.openclaw/.unraid-template-seeded' \
            || { echo "SMOKE FAIL: seed marker missing" 1>&2; docker rm -f smoke >/dev/null 2>&1; exit 1; }
          echo "SMOKE OK"
          docker rm -f smoke >/dev/null

      # PERSISTED-CONFIG UPGRADE GATE: a legacy persisted config must receive
      # the entrypoint's narrow backup-first migration before template-managed
      # writes and first-boot seeding proceed.
      - name: Persisted-config upgrade smoke
        if: steps.gate.outputs.build == 'true'
        run: |
          set -eu
          container=smoke-upgrade
          volume=smoke-upgrade-config
          handoff_marker='[bootstrap] existing config needs OpenClaw migration; applying narrow backup-first migration'

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run --rm -i \
            --entrypoint /bin/sh \
            -v "$volume:/home/node/.openclaw" \
            "$DERIVED_IMAGE:smoke" \
            -ceu 'mkdir -p /home/node/.openclaw && cat > /home/node/.openclaw/openclaw.json' <<'JSON'
          {
            "meta": {
              "lastTouchedAt": "2026-08-01T00:00:00.000Z"
            },
            "gateway": {
              "mode": "local",
              "bind": "lan",
              "controlUi": {
                "allowedOrigins": ["http://127.0.0.1:18789"],
                "allowInsecureAuth": true,
                "dangerouslyDisableDeviceAuth": true
              },
              "auth": { "mode": "token" }
            },
            "agents": {
              "defaults": {
                "memorySearch": { "enabled": false },
                "imageGenerationModel": { "primary": "openai/gpt-image-2" },
                "mediaGenerationAutoProviderFallback": false,
                "compaction": { "truncateAfterCompaction": false }
              }
            },
            "env": {
              "vars": {
                "PERSISTED_CONFIG_UPGRADE_SENTINEL": "preserve-me"
              }
            }
          }
          JSON

          docker run -d --name "$container" \
            -v "$volume:/home/node/.openclaw" \
            -e PUID=1234 -e PGID=1000 \
            -e OPENCLAW_GATEWAY_TOKEN=upgrade-smoke-token \
            -e OPENCLAW_ALLOWED_ORIGINS=http://127.0.0.1:18789 \
            -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e CUSTOM_LLM_API_KEY=upgrade-smoke \
            -e CUSTOM_LLM_API_TYPE=openai-completions \
            -e CUSTOM_LLM_MODEL_ID=upgrade-smoke-model \
            "$DERIVED_IMAGE:smoke"

          gateway_ready() {
            docker exec "$container" node -e 'fetch("http://127.0.0.1:18789/readyz", { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
          }

          handoff_seen=""
          ready=""
          for _ in $(seq 1 24); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
              break
            fi
            if docker logs "$container" 2>&1 | grep -Fqx "$handoff_marker"; then
              handoff_seen=1
            fi
            if [ -n "$handoff_seen" ] && gateway_ready; then
              ready=1
              break
            fi
            sleep 5
          done

          echo "--- persisted-config upgrade log ---"
          docker logs "$container" 2>&1 | tail -80
          if [ -z "$handoff_seen" ]; then
            echo "UPGRADE SMOKE FAIL: bootstrap never emitted the persisted-config migration handoff marker" 1>&2
            exit 1
          fi
          if [ -z "$ready" ] || [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
            echo "UPGRADE SMOKE FAIL: gateway never became ready and alive after persisted-config migration" 1>&2
            exit 1
          fi

          if ! docker exec "$container" test -e /home/node/.openclaw/.unraid-template-seeded; then
            echo "UPGRADE SMOKE FAIL: first-boot template seed did not run after persisted-config migration" 1>&2
            exit 1
          fi
          docker exec "$container" node -e '
            const fs = require("node:fs");
            const configDir = "/home/node/.openclaw";
            const fail = (message) => { console.error(`UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const backups = fs.readdirSync(configDir).filter((name) => /^openclaw\.json\.v2026\.8\.1-backup-.+/.test(name));
            if (backups.length === 0) fail("narrow migration backup missing");
            const backupPath = `${configDir}/${backups[0]}`;
            if (!fs.statSync(backupPath).isFile() || fs.statSync(backupPath).size === 0) fail("narrow migration backup is empty");
            const backup = JSON.parse(fs.readFileSync(backupPath, "utf8"));
            if (backup.meta?.lastTouchedAt !== "2026-08-01T00:00:00.000Z") fail("migration backup did not preserve meta.lastTouchedAt");
            if (backup.gateway?.controlUi?.allowInsecureAuth !== true) fail("migration backup did not preserve allowInsecureAuth");
            if (backup.gateway?.controlUi?.dangerouslyDisableDeviceAuth !== true) fail("migration backup did not preserve dangerouslyDisableDeviceAuth");
            if (backup.agents?.defaults?.memorySearch?.enabled !== false) fail("migration backup did not preserve memorySearch");
            if (backup.agents?.defaults?.imageGenerationModel?.primary !== "openai/gpt-image-2") fail("migration backup did not preserve imageGenerationModel");
            if (backup.agents?.defaults?.mediaGenerationAutoProviderFallback !== false) fail("migration backup did not preserve mediaGenerationAutoProviderFallback");
            if (backup.agents?.defaults?.compaction?.truncateAfterCompaction !== false) fail("migration backup did not preserve truncateAfterCompaction");
            if (backup.env?.vars?.PERSISTED_CONFIG_UPGRADE_SENTINEL !== "preserve-me") fail("migration backup did not preserve the sentinel");
          '
          docker exec "$container" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("/home/node/.openclaw/openclaw.json", "utf8"));
            const fail = (message) => { console.error(`UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            if (config.meta?.lastTouchedAt !== undefined) fail("retired meta.lastTouchedAt remains");
            if (config.gateway?.controlUi?.allowInsecureAuth !== undefined) fail("retired gateway.controlUi.allowInsecureAuth remains");
            if (config.gateway?.controlUi?.dangerouslyDisableDeviceAuth !== undefined) fail("retired gateway.controlUi.dangerouslyDisableDeviceAuth remains");
            if (config.agents?.defaults?.memorySearch !== undefined) fail("legacy agents.defaults.memorySearch remains");
            if (config.memory?.search?.enabled !== false) fail("agents.defaults.memorySearch was not moved to memory.search");
            if (config.agents?.defaults?.imageGenerationModel !== undefined) fail("legacy agents.defaults.imageGenerationModel remains");
            if (config.agents?.defaults?.mediaModels?.image?.primary !== "openai/gpt-image-2") fail("imageGenerationModel was not moved to agents.defaults.mediaModels.image");
            if (config.agents?.defaults?.mediaGenerationAutoProviderFallback !== undefined) fail("retired agents.defaults.mediaGenerationAutoProviderFallback remains");
            if (config.agents?.defaults?.compaction?.truncateAfterCompaction !== undefined) fail("retired agents.defaults.compaction.truncateAfterCompaction remains");
            if (config.env?.vars?.PERSISTED_CONFIG_UPGRADE_SENTINEL !== "preserve-me") fail("preservation sentinel changed during migration");
          '
          echo "PERSISTED-CONFIG UPGRADE SMOKE OK"

      # Push happens only after the smoke gate passed (cache hit — instant).
      - name: Push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENCLAW_TAG=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          tags: |
            ${{ env.DERIVED_IMAGE }}:latest
            ${{ steps.tag.outputs.tag != 'latest' && format('{0}:{1}', env.DERIVED_IMAGE, steps.tag.outputs.tag) || '' }}

  # FAILURE REGISTRATION: when Issues are enabled, file (or update) a
  # deduplicated issue. Standard Actions failure notification email remains
  # available regardless; follow-up failures add comments to the open issue.
  on-failure:
    runs-on: ubuntu-latest
    needs: [build]
    if: failure() && github.event.repository.has_issues
    permissions:
      issues: write
    steps:
      - name: File or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Automated rebuild failed (${{ github.event_name }})"
          BODY="Derived-image build/smoke failed.

          - Run: $RUN_URL
          - Trigger: ${{ github.event_name }}
          - Upstream digest: ${{ needs.build.outputs.upstream_digest || 'n/a (failed before digest capture)' }}

          :latest was NOT updated — deployments keep the previous image.
          Check the smoke log in the run; likely an upstream image layout change
          (entrypoint paths, config CLI, node user) that docker/unraid-entrypoint.sh
          must adapt to."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Still failing: $RUN_URL (upstream digest: ${{ needs.build.outputs.upstream_digest || 'n/a' }})"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY" --label bug
          fi
