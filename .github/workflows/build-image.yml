            echo "WORKSPACE UPGRADE SMOKE FAIL: unsafe legacy source did not emit exactly one refused workspace-migration marker" 1>&2
            exit 1
          fi
          if printf '%s\n' "$refusal_log" | grep -Fq "$workspace_config_secret" || printf '%s\n' "$refusal_log" | grep -Fq "$workspace_source_secret"; then
