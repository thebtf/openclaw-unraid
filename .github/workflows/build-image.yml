            if (!fs.readFileSync(backup).equals(fixture)) fail("exec approvals backup is not byte-identical");
            if (!isDeepStrictEqual(config.bindings?.slice(0, roleFixture.bindings.length), roleFixture.bindings)) fail("named Telegram bindings were not preserved exactly");
            const telegramWildcards = (config.bindings ?? []).filter((binding) => binding?.agentId === "main" && binding?.match?.channel === "telegram" && binding?.match?.accountId === "*");
            if (telegramWildcards.length !== 1) fail("main Telegram channel-wide binding was not materialized exactly once");
            if (config.agents?.entries?.main?.workspace !== path.join(configDir, "workspace")) fail("main workspace role was not materialized");
            for (const key of ["heartbeat", "systemAgent"]) {
              if (config.agents?.defaults?.[key]?.agentId !== "main") fail(`default role ${key} was not materialized for main`);
            }
            if (config.agents?.defaults?.authInheritance !== undefined && config.agents.defaults.authInheritance?.agentId !== "main") fail("existing auth inheritance target was not preserved for main");
            if (config.talk?.agentId !== "main") fail("talk target was not materialized for main");
            const dbPath = path.join(configDir, "state", "openclaw.sqlite");
            const dbStat = fs.lstatSync(dbPath);
            if (!dbStat.isFile() || dbStat.uid !== 1000 || dbStat.gid !== 1000) fail("exec approvals SQLite state is not PUID-owned");
            const db = new DatabaseSync(dbPath, { readOnly: true });
            try {
              const row = db.prepare("SELECT raw_json, socket_path, has_socket_token FROM exec_approvals_config WHERE config_key = ?").get("current");
              if (!row || row.socket_path !== "/tmp/openclaw-exec-approvals.sock" || Number(row.has_socket_token) !== 1) fail("canonical exec approvals row is missing or incomplete");
              const imported = JSON.parse(row.raw_json);
              if (imported.version !== 1 || imported.socket?.token !== "exec-approvals-source-secret-c7be65") fail("canonical exec approvals row does not match the legacy source");
              const receipts = db.prepare("SELECT source_path, source_sha256, source_record_count, removed_source, report_json FROM migration_sources WHERE migration_kind = ? AND target_table = ?").all("legacy-exec-approvals-json", "exec_approvals_config");
