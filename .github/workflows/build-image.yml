          docker run --rm --entrypoint node \
            -v "$refusal_volume:/home/node/.openclaw" \
            -v "$workspace_fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const fail = (message) => { console.error(`WORKSPACE UPGRADE SMOKE FAIL: ${message}`); process.exit(1); };
            const configDir = "/home/node/.openclaw";
            const source = path.join(configDir, "workspace-borges", "openclaw-workspace-state.json");
            const target = path.join(configDir, "workspace-refusal-target.json");
            const expected = JSON.parse(fs.readFileSync("/fixtures/refusal-source-identity.json", "utf8"));
            const actual = fs.lstatSync(source);
            if (!actual.isSymbolicLink()) fail("refused migration replaced the legacy source symlink");
            for (const key of ["dev", "ino", "mode", "nlink", "size"]) {
              const value = key === "dev" || key === "ino" ? String(actual[key]) : actual[key];
              if (value !== expected[key]) fail(`refused migration changed source identity field ${key}`);
            }
            if (fs.readlinkSync(source) !== expected.target) fail("refused migration changed the legacy source symlink target");
            if (!fs.readFileSync(target).equals(fs.readFileSync("/fixtures/refusal-target.json"))) fail("refused migration changed legacy source bytes");
            if (!fs.readFileSync(path.join(configDir, "openclaw.json")).equals(fs.readFileSync("/fixtures/openclaw.json"))) fail("refused migration changed config bytes before managed writes");
            const backup = `${source}.openclaw-2026.8.1-pre-migration.bak`;
            if (fs.existsSync(backup) || fs.existsSync(`${target}.openclaw-2026.8.1-pre-migration.bak`) || fs.existsSync(`${source}.doctor-importing`)) {
              fail("refused migration created a backup or left an upstream source claim");
            }
            const dbPath = path.join(configDir, "state", "openclaw.sqlite");
            if (fs.existsSync(dbPath)) {
              const { DatabaseSync } = require("node:sqlite");
              const db = new DatabaseSync(dbPath, { readOnly: true });
              try {
                const tables = new Set(db.prepare(
                  "SELECT name FROM sqlite_master WHERE type = ? AND name IN (?, ?)"
                ).all("table", "workspace_setup_state", "migration_sources").map((row) => row.name));
                if (tables.has("workspace_setup_state") && Number(db.prepare("SELECT COUNT(*) AS count FROM workspace_setup_state").get().count) !== 0) {
                  fail("refused migration created workspace setup SQLite state");
                }
                if (tables.has("migration_sources") && Number(db.prepare(
                  "SELECT COUNT(*) AS count FROM migration_sources WHERE migration_kind = ?"
                ).get("legacy-workspace-setup-files").count) !== 0) {
                  fail("refused migration created a workspace import receipt");
                }
              } finally {
                db.close();
              }
            }
          '
          echo "PERSISTED MULTI-WORKSPACE UPGRADE SMOKE OK"

      # PERSISTED SESSION-STORE UPGRADE GATE: seed canonical SQLite through the exact image's public importer,
      # then prove the entrypoint migrates a second agent source, archives it, preserves the seed, and converges.
      - name: Persisted session-store upgrade smoke
        if: steps.gate.outputs.build == 'true'
        run: |
          set -eu
          session_container=smoke-session-store-upgrade
          session_restart_container=smoke-session-store-upgrade-restart
          session_refusal_container=smoke-session-store-upgrade-refused
          session_volume=smoke-session-store-upgrade-config
          session_refusal_volume=smoke-session-store-upgrade-refusal-config
          session_fixture_dir=""
          session_config_secret='session-store-config-secret-8b9c2d'
