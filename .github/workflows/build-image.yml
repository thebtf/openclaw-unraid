              -e CUSTOM_LLM_BASE_URL=http://127.0.0.1:9/v1 \
              -e CUSTOM_LLM_API_KEY=session-store-upgrade-smoke \
              -e CUSTOM_LLM_API_TYPE=openai-completions \
              -e CUSTOM_LLM_MODEL_ID=session-store-upgrade-smoke-model \
              "$DERIVED_IMAGE:smoke"
          }
