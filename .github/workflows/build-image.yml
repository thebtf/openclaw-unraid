            if (fs.existsSync(`${source}.openclaw-2026.8.2-pre-migration.bak`) || fs.existsSync(`${source}.doctor-importing`) || fs.existsSync(path.join(configDir, "state", "openclaw.sqlite"))) fail("config dry-run created approvals backup, claim, or SQLite state");
          '


