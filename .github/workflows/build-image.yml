            });
            const expected = JSON.parse(fs.readFileSync("/fixtures/migrated-session-state.json", "utf8"));
            const actual = manifestPaths(path.join(configDir, "session-sqlite-migration-runs")).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected.manifestPaths)) fail("restart created a new session migration manifest");
            for (const [agent, sessionId] of [["main", "main-sentinel-session"], ["borges", "borges-import-session"]]) {
              const database = new DatabaseSync(path.join(configDir, "agents", agent, "agent", "openclaw-agent.sqlite"), { readOnly: true });
              try {
                const row = database.prepare("SELECT COUNT(*) AS count FROM session_nodes WHERE session_key = ?").get(`agent:${agent}:main`);
                if (Number(row.count) !== 1) fail(`restart duplicated the ${agent} session`);
              } finally {
                database.close();
              }
            }
          '

          docker run --rm --entrypoint /bin/sh \
            -v "$session_refusal_volume:/home/node/.openclaw" \
            -v "$session_fixture_dir:/fixtures:ro" \
            "$DERIVED_IMAGE:smoke" -ceu '
              mkdir -p /home/node/.openclaw/agents/borges/sessions
              cp /fixtures/openclaw.json /home/node/.openclaw/openclaw.json
              cp /fixtures/malformed-sessions.json /home/node/.openclaw/agents/borges/sessions/sessions.json
